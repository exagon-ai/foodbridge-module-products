<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f4f5f7">
  <title>Products V2 — Mobile Preview</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#e5e7eb;color:#111827}
    body{display:grid;place-items:center;padding:24px}
    .preview{width:444px;max-width:100%;height:min(836px,calc(100vh - 48px));min-height:640px;background:#fff;border:1px solid #cbd5e1;border-radius:28px;overflow:hidden;box-shadow:0 22px 60px rgba(15,23,42,.22)}
    iframe{display:block;width:100%;height:100%;border:0;background:#f4f5f7}
    @media(max-width:520px){body{display:block;padding:0}.preview{width:100%;max-width:none;height:100dvh;min-height:0;border:0;border-radius:0;box-shadow:none}}
  </style>
</head>
<body>
  <main class="preview" aria-label="Foodbridge Products V2 mobile preview">
    <iframe src="v2.html" title="Foodbridge Products V2 mobile interface"></iframe>
  </main>
</body>
</html>
